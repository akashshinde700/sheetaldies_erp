# ─────────────────────────────────────────────────────────────────────────────
# REFERENCE ONLY — the live nginx vhost is managed by CloudPanel, not this file.
#
# The site (www.codeprana.com) is a CloudPanel "Reverse Proxy" / Node.js site:
# nginx terminates SSL and proxies EVERYTHING to the Node process on
# 127.0.0.1:3000 (see deploy.py BACKEND_PORT). Express then serves both the API
# (/api/*, /uploads/*) and the built frontend (backend/public).
#
# IMPORTANT — image uploads:
#   CloudPanel's default proxy vhost caps the request body at ~1 MB, so photos
#   over that size fail with "413 Request Entity Too Large" from nginx before
#   they ever reach Node (the app itself allows 5 MB per file).
#
#   Fix in CloudPanel:  Sites → codeprana.com → Vhost  →  add inside `server {}`:
#
#       client_max_body_size 25M;
#
#   or per-location:
#
#       location /api/     { client_max_body_size 25M; proxy_pass http://127.0.0.1:3000; ... }
#       location /uploads/ { client_max_body_size 25M; proxy_pass http://127.0.0.1:3000; ... }
#
#   Then: CloudPanel reloads nginx automatically on save.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name codeprana.com www.codeprana.com;

    # ↓↓↓ the line that lets multi-MB photos through
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
